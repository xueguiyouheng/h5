info:
  contact: {}
  description: |-
    商城前端与运营中台共用的后端接口。响应统一信封 {code,message,data}；
    认证为 HttpOnly Cookie sso_token，写操作需回传 X-CSRF-Token。
    文档生成：swag init -g main.go -o docs/swagger，访问 /swagger/index.html
  title: FreshMart 生鲜商城 API
  version: "1.0"
paths:
  /api/addresses:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.AddressList'
              type: object
      security:
      - CookieAuth: []
      summary: 收货地址列表
      tags:
      - address
    post:
      consumes:
      - application/json
      description: 首条地址自动设为默认
      parameters:
      - description: 标签与详细地址
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.AddressRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Address'
              type: object
      security:
      - CookieAuth: []
      summary: 新增收货地址
      tags:
      - address
  /api/addresses/{id}:
    delete:
      description: 删除默认地址后服务端回退到列表第一条
      parameters:
      - description: 地址 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ApiResponse'
      security:
      - CookieAuth: []
      summary: 删除收货地址
      tags:
      - address
    patch:
      consumes:
      - application/json
      parameters:
      - description: 地址 ID
        in: path
        name: id
        required: true
        type: string
      - description: 标签与详细地址
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.AddressRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Address'
              type: object
      security:
      - CookieAuth: []
      summary: 编辑收货地址
      tags:
      - address
  /api/addresses/{id}/default:
    put:
      parameters:
      - description: 地址 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ApiResponse'
      security:
      - CookieAuth: []
      summary: 设为默认收货地址
      tags:
      - address
  /api/admin/carousel:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.CarouselList'
              type: object
      security:
      - CookieAuth: []
      summary: 轮播配置列表
      tags:
      - admin
    post:
      consumes:
      - application/json
      parameters:
      - description: 轮播内容
