basePath: /api
definitions:
  models.AddManyToCartRequest:
    properties:
      items:
        items:
          $ref: '#/definitions/models.CartAddItem'
        type: array
    required:
    - items
    type: object
  models.AddToCartRequest:
    properties:
      product_id:
        type: string
      qty:
        type: integer
    required:
    - product_id
    type: object
  models.AddressRequest:
    properties:
      as_default:
        type: boolean
      detail:
        type: string
      label:
        type: string
    type: object
  models.AdminOrderCancelRequest:
    properties:
      reason:
        type: string
    type: object
  models.AdminOrderRemarkRequest:
    properties:
      admin_remark:
        type: string
    type: object
  models.AdminOrderShippingRequest:
    properties:
      courier_name:
        type: string
      courier_phone:
        type: string
      tracking_no:
        type: string
    type: object
  models.AdminOrderStatusRequest:
    properties:
      note:
        type: string
      status:
        type: string
    required:
    - status
    type: object
  models.ApiResponse:
    properties:
      code:
        description: HTTP 状态码
        type: integer
      data:
        description: 业务数据，类型根据接口而定
        type: object
      message:
        description: 提示信息，如 "success" 或错误描述
        type: string
    type: object
  models.CarouselRequest:
    properties:
      image_url:
        type: string
      link:
        type: string
      sort:
        type: integer
      status:
        type: string
      title:
        type: string
    required:
    - image_url
    - title
    type: object
  models.CartAddItem:
    properties:
      product_id:
        type: string
      qty:
        type: integer
    required:
    - product_id
    type: object
  models.CartSelectionRequest:
    properties:
      all:
        type: boolean
      item_ids:
        items:
          type: string
        type: array
    type: object
  models.CategoryRequest:
    properties:
      image_url:
        type: string
      name:
        type: string
      sort:
        type: integer
      status:
        type: string
      subcategories:
        items:
          $ref: '#/definitions/models.SubcategoryRequest'
        type: array
    required:
    - name
    type: object
  models.ChatRequest:
    properties:
      content_type:
        type: string
      media_name:
        description: 图片消息随带原始文件名与字节数，前端气泡要展示「图片 · 名称 大小 KB」
        type: string
      media_size:
        type: integer
      media_url:
        type: string
      text:
        type: string
    type: object
  models.CheckoutPreviewRequest:
    properties:
      address_id:
        type: string
      item_ids:
        items:
          type: string
        type: array
      voucher_id:
        type: string
    type: object
  models.CreateOrderRequest:
    properties:
      address_id:
        type: string
      item_ids:
        items:
          type: string
        type: array
      payment_method:
        type: string
      remark:
        type: string
      voucher_id:
        type: string
    type: object
  models.FavoriteRemoveRequest:
    properties:
      product_ids:
        items:
          type: string
        type: array
    required:
    - product_ids
    type: object
  models.FavoriteRequest:
    properties:
      product_id:
        type: string
    required:
    - product_id
    type: object
  models.LanguageRequest:
    properties:
      language:
        type: string
    required:
    - language
    type: object
  models.LoginRequest:
    properties:
      email:
        description: 邮箱，语义同上
        type: string
      password:
        description: 密码，必填
        type: string
      username:
        description: 用户名、邮箱或手机号
        type: string
    required:
    - password
    type: object
  models.Nutrition:
    properties:
      calories:
        type: integer
      per:
        type: string
    type: object
  models.ProductRequest:
    properties:
      badge:
        type: string
      category_id:
        type: string
      currency:
        type: string
      description:
        type: string
      image_url:
        type: string
      images:
        items:
          type: string
        type: array
      name:
        type: string
      nutrition:
        $ref: '#/definitions/models.Nutrition'
        type: object
      old_price:
        type: string
      price:
        type: string
      sections:
        items:
          type: string
        type: array
      sort:
        type: integer
      status:
        type: string
      stock:
        type: integer
      subcategory_id:
        type: string
      unit:
        type: string
    required:
    - category_id
    - image_url
    - name
    - price
    type: object
  models.RatingRequest:
    properties:
      value:
        type: integer
    required:
    - value
    type: object
  models.ReadRequest:
    properties:
      ids:
        items:
          type: string
        type: array
    type: object
  models.RedeemRequest:
    properties:
      code:
        type: string
    required:
    - code
    type: object
  models.RegisterRequest:
    properties:
      account_type:
        type: string
      email:
        type: string
      latitude:
        type: number
      longitude:
        type: number
      mobile:
        type: string
      password:
        type: string
      store_address:
        type: string
      store_name:
        type: string
      username:
        type: string
    required:
    - email
    - mobile
    - password
    - username
    type: object
  models.ResetPasswordRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  models.ResetVerifyRequest:
    properties:
      code:
        type: string
      new_password:
        type: string
    required:
    - code
    - new_password
    type: object
  models.SetQtyRequest:
    properties:
      qty:
        type: integer
    type: object
  models.StatusRequest:
    properties:
      status:
        type: string
    required:
    - status
    type: object
  models.StoreProfileRequest:
    properties:
      address:
        type: string
      delivery_radius_km:
        type: integer
      description:
        type: string
      latitude:
        type: number
      logo_url:
        type: string
      longitude:
        type: number
      min_order_amount:
        type: string
      name:
        type: string
      notice:
        type: string
      phone:
        type: string
      status:
        type: string
    type: object
  models.StoreSelectionRequest:
    properties:
      latitude:
        type: number
      longitude:
        type: number
      store_id:
        type: string
    required:
    - store_id
    type: object
  models.SubcategoryRequest:
    properties:
      id:
        type: string
      name:
        type: string
      sort:
        type: integer
    required:
    - name
    type: object
  models.UpdateMemberRequest:
    properties:
      avatar_url:
        type: string
      email:
        type: string
      gender:
        type: string
      mobile:
        type: string
      old_password:
        type: string
      password:
        type: string
      username:
        type: string
    type: object
  models.VoteRequest:
    properties:
      helpful:
        type: boolean
    required:
    - helpful
    type: object
  payment.LaunchRequest:
    properties:
      outcome:
        type: string
    type: object
  payment.MockNotifyRequest:
    properties:
      outcome:
        type: string
    type: object
  payment.PrepayRequest:
    properties:
      order_id:
        type: string
      provider:
        type: string
    required:
    - order_id
    - provider
    type: object
info:
  contact: {}
  description: |-
    商城前端与运营中台共用的后端接口。响应统一信封 {code,message,data}；
    认证为 HttpOnly Cookie sso_token，写操作需回传 X-CSRF-Token。
    文档生成：swag init -g main.go -o docs/swagger，访问 /swagger/index.html
  license: {}
  title: FreshMart 生鲜商城 API
  version: "1.0"
paths:
  /api/addresses:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ApiResponse'
      security:
      - CookieAuth: []
      summary: 收货地址列表
      tags:
      - address
    post:
      consumes:
      - application/json
      description: 首条地址自动设为默认
      parameters:
      - description: 标签与详细地址
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.AddressRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ApiResponse'
      security:
      - CookieAuth: []
      summary: 新增收货地址
      tags:
      - address
  /api/addresses/{id}:
    delete:
      description: 删除默认地址后服务端回退到列表第一条
      parameters:
      - description: 地址 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ApiResponse'
      security:
      - CookieAuth: []
      summary: 删除收货地址
      tags:
      - address
    patch:
      consumes:
      - application/json
      parameters:
      - description: 地址 ID
        in: path
        name: id
        required: true
        type: string
      - description: 标签与详细地址
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.AddressRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ApiResponse'
      security:
      - CookieAuth: []
      summary: 编辑收货地址
      tags:
      - address
  /api/addresses/{id}/default:
    put:
      parameters:
      - description: 地址 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ApiResponse'
      security:
      - CookieAuth: []
      summary: 设为默认收货地址
      tags:
      - address
  /api/admin/carousel:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ApiResponse'
      security:
      - CookieAuth: []
      summary: 轮播配置列表（本店）
      tags:
      - admin
    post:
      consumes:
      - application/json
      parameters:
      - description: 轮播内容
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.CarouselRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ApiResponse'
      security:
      - CookieAuth: []
      summary: 新增轮播配置
      tags:
      - admin
  /api/admin/carousel/{id}:
    delete:
      parameters:
      - description: 轮播 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ApiResponse'
      security:
      - CookieAuth: []
      summary: 删除轮播配置
      tags:
      - admin
    put:
      consumes:
      - application/json
      parameters:
      - description: 轮播 ID
        in: path
        name: id
        required: true
        type: string
      - description: 轮播内容
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.CarouselRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ApiResponse'
      security:
      - CookieAuth: []
      summary: 编辑轮播配置
      tags:
      - admin
  /api/admin/categories:
    get:
      parameters:
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页条数，默认 20
        in: query
        name: page_size
        type: integer
      - description: 名称模糊搜索
        in: query
        name: keyword
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ApiResponse'
      security:
      - CookieAuth: []
      summary: 类目分页列表（本店）
      tags:
      - admin
    post:
      consumes:
      - application/json
      parameters:
      - description: 类目内容
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.CategoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ApiResponse'
      security:
      - CookieAuth: []
      summary: 新增类目及其子类目
      tags:
      - admin
  /api/admin/categories/{id}:
    delete:
      description: 类目下仍有商品时返回 422
      parameters:
      - description: 类目 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ApiResponse'
      security:
      - CookieAuth: []
      summary: 删除类目
      tags:
      - admin
    get:
      parameters:
      - description: 类目 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ApiResponse'
      security:
      - CookieAuth: []
      summary: 类目详情（含子类目）
      tags:
      - admin
    put:
      consumes:
      - application/json
      description: subcategories 为全量替换，未传则保持原子类目
      parameters:
      - description: 类目 ID
        in: path
        name: id
        required: true
        type: string
      - description: 类目内容
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.CategoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ApiResponse'
      security:
      - CookieAuth: []
      summary: 编辑类目
      tags:
      - admin
  /api/admin/orders:
    get:
      description: status 为空查全部；keyword 命中单号 / 收货人 / 手机号
      parameters:
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页条数，默认 10
        in: query
        name: page_size
        type: integer
      - description: 单号 / 收货人 / 手机号
        in: query
        name: keyword
        type: string
      - description: accepted / ready / delivered / cancelled
        in: query
        name: status
        type: string
      - description: unpaid / paid
        in: query
        name: payment_status
        type: string
      - description: 起始时间 RFC3339
        in: query
        name: since
        type: string
      - description: 结束时间 RFC3339
        in: query
        name: until
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ApiResponse'
      security:
      - CookieAuth: []
      summary: 订单分页列表（本店）
      tags:
      - admin
  /api/admin/orders/{id}:
    get:
      parameters:
      - description: 订单 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ApiResponse'
      security:
      - CookieAuth: []
      summary: 订单详情（含支付单与处理留痕）
      tags:
      - admin
  /api/admin/orders/{id}/cancel:
    post:
      consumes:
      - application/json
      description: 回补库存与优惠券；已支付订单标记 refund_status=pending 走线下退款
      parameters:
      - description: 订单 ID
        in: path
        name: id
        required: true
        type: string
      - description: 取消原因
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.AdminOrderCancelRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ApiResponse'
      security:
      - CookieAuth: []
      summary: 商家取消订单
      tags:
      - admin
  /api/admin/orders/{id}/remark:
    put:
      consumes:
      - application/json
      parameters:
      - description: 订单 ID
        in: path
        name: id
        required: true
        type: string
      - description: 备注内容
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.AdminOrderRemarkRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ApiResponse'
      security:
      - CookieAuth: []
      summary: 编辑商家备注
      tags:
      - admin
  /api/admin/orders/{id}/shipping:
    put:
      consumes:
      - application/json
      description: 自配送填骑手与电话，快递填运单号；留空即清除对应字段
      parameters:
      - description: 订单 ID
        in: path
        name: id
        required: true
        type: string
      - description: 配送信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.AdminOrderShippingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ApiResponse'
      security:
      - CookieAuth: []
      summary: 填写配送信息
      tags:
      - admin
  /api/admin/orders/{id}/status:
    put:
      consumes:
      - application/json
      description: accepted → ready → delivered，ready 可退回 accepted；未支付订单返回 422
      parameters:
      - description: 订单 ID
        in: path
        name: id
        required: true
        type: string
      - description: 目标状态与备注
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.AdminOrderStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ApiResponse'
      security:
      - CookieAuth: []
      summary: 推进订单状态
      tags:
      - admin
  /api/admin/orders/summary:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ApiResponse'
      security:
      - CookieAuth: []
      summary: 订单各状态计数与今日概览
      tags:
      - admin
  /api/admin/products:
    get:
      parameters:
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页条数，默认 20
        in: query
        name: page_size
        type: integer
      - description: 名称模糊搜索
        in: query
        name: keyword
        type: string
      - description: 按类目过滤
        in: query
        name: category_id
        type: string
      - description: on / off
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ApiResponse'
      security:
      - CookieAuth: []
      summary: 商品分页列表（本店）
      tags:
      - admin
    post:
      consumes:
      - application/json
      description: 图片先走 POST /api/uploads 拿到 URL，商品文档只保存 URL
      parameters:
      - description: 商品内容
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.ProductRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ApiResponse'
      security:
      - CookieAuth: []
      summary: 发布商品
      tags:
      - admin
  /api/admin/products/{id}:
    delete:
      parameters:
      - description: 商品 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ApiResponse'
      security:
      - CookieAuth: []
      summary: 删除商品
      tags:
      - admin
    get:
      parameters:
      - description: 商品 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ApiResponse'
      security:
      - CookieAuth: []
      summary: 商品详情
      tags:
      - admin
    put:
      consumes:
      - application/json
      parameters:
      - description: 商品 ID
        in: path
        name: id
        required: true
        type: string
      - description: 商品内容
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.ProductRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ApiResponse'
      security:
      - CookieAuth: []
      summary: 编辑商品
      tags:
      - admin
  /api/admin/products/{id}/status:
    put:
      consumes:
      - application/json
      parameters:
      - description: 商品 ID
        in: path
        name: id
        required: true
        type: string
      - description: on / off
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.StatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ApiResponse'
      security:
      - CookieAuth: []
      summary: 商品上下架
      tags:
      - admin
  /api/admin/stats:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ApiResponse'
      security:
      - CookieAuth: []
      summary: 中台首页计数（本店）
      tags:
      - admin
  /api/admin/store:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
